apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: infra-vks-01
  namespace: kim-prod-x4tqc
  labels:
    cluster.x-k8s.io/cluster-name: infra-vks-01
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    description: "VKS Cluster - Wave 0: Initial cluster creation"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.95.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/12
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.7.0
      namespace: vmware-system-vks-public
    version: v1.36.2---vmware.2-vkr.3
    variables:
      - name: vmClass
        value: best-effort-medium
      - name: storageClass
        value: vsan-default-storage-policy
    controlPlane:
      replicas: 3
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: os-name=photon
    workers:
      machineDeployments:
        - class: node-pool
          name: infra-vks-01-np-k3sx
          replicas: 2
          metadata:
            annotations:
              run.tanzu.vmware.com/resolve-os-image: os-name=photon
