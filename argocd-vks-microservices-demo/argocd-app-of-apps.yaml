---
# App of Apps - ArgoCD VKS Cluster Registration
# 
# This Application orchestrates the creation and registration of the VKS cluster
# in a controlled, wave-based manner:
#
#   Wave 0: Create infra-vks-01 (infrastructure/)
#
#   Wave 10: Register cluster to ArgoCD (argocd-managedentity.yaml)
#     - Creates RBAC permissions for ArgoCD
#     - Registers the cluster as a ManagedEntity
#     - Creates VKS AddonInstalls for cert-manager, contour, and prometheus
#     - Cluster becomes available as deployment target
#   Wave 20: Create the online-boutique Application
#
# Apply with: kubectl apply -n <argocd-namespace> -f argocd-app-of-apps.yaml
# Monitor with: argocd app get argocd-vks-app-of-apps -w

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-vks-app-of-apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app-type: app-of-apps
spec:
  project: default

  source:
    repoURL: https://github.com/maxiepax/argocd
    targetRevision: HEAD
    path: argocd-vks-microservices-demo
    directory:
      recurse: true
      include: '{infrastructure/*,argocd-managedentity.yaml,application/*-app.yaml,infra-vks-01.yaml,argocd-vks.yaml,cert-manager-addon.yaml,contour-addon.yaml,prometheus-addon.yaml}'
  
  destination:
    server: kim-prod-vlryx
    namespace: kim-prod-vlryx
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
