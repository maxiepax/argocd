---
# Service Account on the VKS cluster for ArgoCD
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-managed-cluster-secret
  namespace: argocd
---
# Role with permissions for ArgoCD
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-managed-cluster-secret
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
# Bind the role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-managed-cluster-secret
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-managed-cluster-secret
subjects:
  - kind: ServiceAccount
    name: argocd-managed-cluster-secret
    namespace: argocd
---
# The ManagedEntity that registers the cluster to ArgoCD
apiVersion: argocd.vmware.com/v1alpha1
kind: ManagedEntity
metadata:
  name: argocd-vks-managed
  namespace: kim-prod-vlryx
spec:
  argocdInstance:
    name: argocd-vm
    namespace: kim-prod-vlryx
  cluster:
    name: argocd-vks
    namespace: kim-prod-vlryx
  serviceAccount:
    name: argocd-managed-cluster-secret
    namespace: argocd
