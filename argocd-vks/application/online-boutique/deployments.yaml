apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis-cart}
  template:
    metadata:
      labels: {app: redis-cart}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: public.ecr.aws/docker/library/redis:8.6.4-alpine3.23
          ports: [{containerPort: 6379}]
          readinessProbe:
            tcpSocket: {port: 6379}
          resources:
            requests: {cpu: 70m, memory: 200Mi}
            limits: {cpu: 125m, memory: 256Mi}
